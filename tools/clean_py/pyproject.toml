[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clean-py"
version = "0.1.0"
description = "Clean Python AST & Quality Validator Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "radon>=5.1.0",
    "ruff>=0.1.0",
]

[project.scripts]
clean-py = "clean_py.cli:main"
